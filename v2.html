<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>진짜같은 가짜팬 박주석은 못말려2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a3d0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;

  canvas { border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = Math.min(window.innerWidth, 420);
const H = Math.min(window.innerHeight, 720);
canvas.width = W;
canvas.height = H;

// ========== 축구공 프리렌더 ==========
// 절두이십면체 2D 투영: 검은 오각형 + 흰 육각형 + 이음선(seam)
function createSoccerBallImage(size) {
  const res = size * 6;
  const c = document.createElement('canvas');
  c.width = c.height = res;
  const g = c.getContext('2d');
  const midX = res / 2, midY = res / 2, R = res * 0.45;

  const DEG = Math.PI / 180;
  const armAng = [0,1,2,3,4].map(i => (-90 + i * 72) * DEG);
  const hexAng = [0,1,2,3,4].map(i => (-54 + i * 72) * DEG);

  function polar(r, a) { return [midX + R * r * Math.cos(a), midY + R * r * Math.sin(a)]; }

  // 30개 꼭짓점
  const v = [];
  // Ring 0: 가운데 오각형 (0-4)
  for (let i = 0; i < 5; i++) v.push(polar(0.30, armAng[i]));
  // Ring 1: 바깥 분기점 (5-9)
  for (let i = 0; i < 5; i++) v.push(polar(0.62, armAng[i]));
  // Ring 2: 육각형 먼 꼭짓점 (10-19), 2개씩
  for (let j = 0; j < 5; j++) {
    v.push(polar(0.82, hexAng[j] - 18 * DEG));
    v.push(polar(0.82, hexAng[j] + 18 * DEG));
  }
  // Ring 3: 바깥 오각형 먼 꼭짓점 (20-29), 2개씩
  for (let i = 0; i < 5; i++) {
    v.push(polar(0.99, armAng[i] - 30 * DEG));
    v.push(polar(0.99, armAng[i] + 30 * DEG));
  }

  // 클리핑
  g.save();
  g.beginPath(); g.arc(midX, midY, R, 0, Math.PI * 2); g.clip();

  // 구체 그라데이션 배경
  const bg = g.createRadialGradient(midX - R * 0.25, midY - R * 0.28, R * 0.05, midX + R * 0.08, midY + R * 0.08, R);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.45, '#f8f8f8');
  bg.addColorStop(0.75, '#e4e4e4');
  bg.addColorStop(1, '#ababab');
  g.fillStyle = bg;
  g.beginPath(); g.arc(midX, midY, R, 0, Math.PI * 2); g.fill();

  const seamW = res * 0.02;
  const seamCol = 'rgba(35,35,35,0.6)';

  function drawFace(indices, fill) {
    g.beginPath();
    indices.forEach((vi, i) => {
      if (i === 0) g.moveTo(v[vi][0], v[vi][1]);
      else g.lineTo(v[vi][0], v[vi][1]);
    });
    g.closePath();
    g.fillStyle = fill;
    g.fill();
    g.strokeStyle = seamCol;
    g.lineWidth = seamW;
    g.lineJoin = 'round';
    g.stroke();
  }

  // 1) 흰색 육각형 5개 (배경 위에 그려서 seam만 보임)
  for (let j = 0; j < 5; j++) {
    const next = (j + 1) % 5;
    drawFace([j, 5 + j, 10 + 2 * j, 10 + 2 * j + 1, 5 + next, next], '#f3f3f1');
  }

  // 2) 바깥 검은 오각형 5개
  for (let i = 0; i < 5; i++) {
    const prev = (i + 4) % 5;
    drawFace([5 + i, 10 + 2 * i, 20 + 2 * i + 1, 20 + 2 * i, 10 + 2 * prev + 1], '#1a1a1a');
  }

  // 3) 가운데 검은 오각형
  drawFace([0, 1, 2, 3, 4], '#111111');

  // 4) 바깥 림 이음선 (부분적으로 보이는 육각형 테두리)
  g.strokeStyle = seamCol;
  g.lineWidth = seamW;
  g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const a = 20 + 2 * i + 1;
    const b = 20 + 2 * ((i + 1) % 5);
    g.beginPath(); g.moveTo(v[a][0], v[a][1]); g.lineTo(v[b][0], v[b][1]); g.stroke();
  }

  g.restore();

  // 하이라이트 (유광 반사)
  const hl = g.createRadialGradient(midX - R * 0.32, midY - R * 0.35, 0, midX - R * 0.1, midY - R * 0.1, R * 0.55);
  hl.addColorStop(0, 'rgba(255,255,255,0.6)');
  hl.addColorStop(0.35, 'rgba(255,255,255,0.18)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hl;
  g.beginPath(); g.arc(midX, midY, R, 0, Math.PI * 2); g.fill();

  // 외곽선
  g.strokeStyle = 'rgba(0,0,0,0.18)';
  g.lineWidth = res * 0.012;
  g.beginPath(); g.arc(midX, midY, R, 0, Math.PI * 2); g.stroke();

  return c;
}

// 불공 이미지
function createFireBallImage(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size * 2.5;
  const g = c.getContext('2d');
  const cx = size * 1.25, cy = size * 1.25, r = size * 0.9;
  const glow = g.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 1.4);
  glow.addColorStop(0, 'rgba(255,200,50,0.6)');
  glow.addColorStop(0.5, 'rgba(255,80,0,0.3)');
  glow.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = glow;
  g.beginPath(); g.arc(cx, cy, r * 1.4, 0, Math.PI * 2); g.fill();
  const bg = g.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
  bg.addColorStop(0, '#ffdd44');
  bg.addColorStop(0.4, '#ff6600');
  bg.addColorStop(1, '#cc2200');
  g.fillStyle = bg;
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,200,0.4)';
  g.beginPath(); g.arc(cx - r * 0.2, cy - r * 0.2, r * 0.4, 0, Math.PI * 2); g.fill();
  return c;
}

// 프리렌더
const ballImages = {};
const fireBallImages = {};
[10, 12, 14, 16].forEach(s => {
  ballImages[s] = createSoccerBallImage(s);
  fireBallImages[s] = createFireBallImage(s);
});

// ========== 축구장 배경 ==========
const fieldBg = document.createElement('canvas');
fieldBg.width = W; fieldBg.height = H;
(function drawField() {
  const g = fieldBg.getContext('2d');
  const grass = g.createLinearGradient(0, 0, 0, H);
  grass.addColorStop(0, '#2d8c3c');
  grass.addColorStop(1, '#1f6b2c');
  g.fillStyle = grass;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < H; i += 40) {
    g.fillStyle = i % 80 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.02)';
    g.fillRect(0, i, W, 40);
  }
  for (let i = 0; i < 500; i++) {
    g.fillStyle = `rgba(${Math.random() > 0.5 ? '255,255,255' : '0,50,0'},0.02)`;
    g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  g.strokeStyle = 'rgba(255,255,255,0.35)';
  g.lineWidth = 2;
  const m = 20;
  g.strokeRect(m, m, W - m * 2, H - m * 2);
  g.beginPath(); g.moveTo(m, H / 2); g.lineTo(W - m, H / 2); g.stroke();
  g.beginPath(); g.arc(W / 2, H / 2, 55, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.4)';
  g.beginPath(); g.arc(W / 2, H / 2, 3, 0, Math.PI * 2); g.fill();
  const penW = 140, penH = 60, goalW = 70, goalH = 25;
  g.strokeRect((W - penW) / 2, m, penW, penH);
  g.strokeRect((W - goalW) / 2, m, goalW, goalH);
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); g.arc(W / 2, m + penH - 10, 2.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(W / 2, m + penH - 10, 22, 0.3 * Math.PI, 0.7 * Math.PI); g.stroke();
  g.strokeRect((W - penW) / 2, H - m - penH, penW, penH);
  g.strokeRect((W - goalW) / 2, H - m - goalH, goalW, goalH);
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); g.arc(W / 2, H - m - penH + 10, 2.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(W / 2, H - m - penH + 10, 22, 1.3 * Math.PI, 1.7 * Math.PI); g.stroke();
  [[m, m, 0, 0.5], [W - m, m, 0.5, 1], [m, H - m, 1.5, 2], [W - m, H - m, 1, 1.5]].forEach(([cx, cy, a1, a2]) => {
    g.beginPath(); g.arc(cx, cy, 10, a1 * Math.PI, a2 * Math.PI); g.stroke();
  });
})();

// ========== K리그2 데이터 ==========
const kleague2Teams = [
  '충북청주FC', '충남아산', '천안시티FC', '경남FC', '김포FC',
  '안산그리너스', '수원삼성', '성남FC', '화성FC',
  '서울이랜드', '부천FC', '전남드래곤즈',
];
const busanPlayers = [
  '크리스찬', '백가온', '김찬', '장호익', '이동수',
  '김민혁', '전성진', '우주성', '안현범', '사비에르',
];

// ========== 게임 상태 ==========
const MATCH_TIME = 660; // 11초 = 660프레임 (10초 정규 + 1초 추가시간)
// 시간 표시: 전반 10,20,30,40,45 / 후반 10,20,30,40,45 / 추가시간
const MATCH_MINUTES = ['전반 10\'', '전반 20\'', '전반 30\'', '전반 40\'', '전반 45\'',
                       '후반 10\'', '후반 20\'', '후반 30\'', '후반 40\'', '후반 45\'', '추가시간'];
const TOTAL_MATCHES = 10;

let state = 'ready'; // ready, playing, matchResult, ending, over
let time = 0;
let screenShakeX = 0, screenShakeY = 0;

const restartBtn = { x: W / 2 - 70, y: 0, w: 140, h: 44 };
const nextBtn = { x: W / 2 - 70, y: 0, w: 140, h: 44 };

// 경기 시스템
let matchIndex = 0;
let matchOpponent = '';
let matchTimer = 0;         // 남은 경기 시간 (프레임)
let busanGoals = 0;
let opponentGoals = 0;
let matchWins = 0;
let matchDraws = 0;
let matchLosses = 0;
let matchSchedule = [];
let boardMessage = '';
let boardTimer = 0;
let goalScorers = [];
let matchDifficulty = 1;    // 경기마다 증가

function shuffleTeams() {
  matchSchedule = [...kleague2Teams].sort(() => Math.random() - 0.5);
}

function startMatch() {
  state = 'playing';
  matchOpponent = matchSchedule[matchIndex % matchSchedule.length];
  busanGoals = 0;
  opponentGoals = 0;
  matchTimer = MATCH_TIME;
  goalScorers = [];
  balls = [];
  particles = [];
  floatingTexts = [];
  matchDifficulty = 1.2 + matchIndex * 0.4; // 경기마다 난이도 UP (더 가파르게)
  player.x = W / 2; player.vx = 0; player.invincible = 0;
  boardMessage = `${matchIndex + 1}R  부산 vs ${matchOpponent}`;
  boardTimer = 120;
}

const player = {
  x: W / 2, y: H - 70,
  vx: 0, ax: 0,
  friction: 0.96,
  accel: 0.55,
  maxSpeed: 8,
  frame: 0, frameTimer: 0,
  direction: 1, invincible: 0,
};

let balls = [];
let particles = [];
let floatingTexts = [];
let inputLeft = false, inputRight = false;

// 앞뒤 전환 (벽 부딪히면 전환)
let facingBack = false;

// 말풍선 시스템
const speeches = [
  '오~최강부산!', '자! 출발!', '배댈 꺼져!',
  '배댈은 가짜팬', '박주석이 최고야!',
  '사나이 자존심\n부산에 걸었다!', '아이파크 화이팅!',
  '부산은 하나다!', '오늘도 승리다!',
  '배댈 망해라~', '진짜팬은 나야!',
  '아 미끄러워!!', '공 너무 많아ㅠ',
  '나 박주석이다!', 'HDC 최고!',
  '부산 갈매기~♪', '경기장 가고싶다!',
];
let speechBubble = { text: '', timer: 0, x: 0, y: 0 };
let lastSpeechTime = 0;

// 경기종료 / 엔딩 전환 타이머
let transitionTimer = 0;

// ========== 입력 ==========
function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function isRestartBtnHit(cx, cy) {
  return cx >= restartBtn.x && cx <= restartBtn.x + restartBtn.w &&
         cy >= restartBtn.y && cy <= restartBtn.y + restartBtn.h;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
  if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
  if (state === 'ready') startGame();
  if ((state === 'over' || state === 'ending') && (e.key === 'Enter' || e.key === ' ')) startGame();
  if (state === 'matchResult' && (e.key === 'Enter' || e.key === ' ')) { matchIndex++; startMatch(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
  if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const pos = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
  if (state === 'ready') { startGame(); return; }
  if (state === 'over' || state === 'ending') {
    if (isRestartBtnHit(pos.x, pos.y)) startGame();
    return;
  }
  if (state === 'matchResult') {
    const nb = nextBtn;
    if (pos.x >= nb.x && pos.x <= nb.x + nb.w && pos.y >= nb.y && pos.y <= nb.y + nb.h) {
      matchIndex++; startMatch();
    }
    return;
  }
  if (pos.x < W / 2) inputLeft = true; else inputRight = true;
});
canvas.addEventListener('touchend', e => { e.preventDefault(); inputLeft = false; inputRight = false; });

canvas.addEventListener('mousedown', e => {
  const pos = getCanvasPos(e.clientX, e.clientY);
  if (state === 'ready') { startGame(); return; }
  if (state === 'over' || state === 'ending') {
    if (isRestartBtnHit(pos.x, pos.y)) startGame();
    return;
  }
  if (state === 'matchResult') {
    const nb = nextBtn;
    if (pos.x >= nb.x && pos.x <= nb.x + nb.w && pos.y >= nb.y && pos.y <= nb.y + nb.h) {
      matchIndex++; startMatch();
    }
    return;
  }
  if (pos.x < W / 2) inputLeft = true; else inputRight = true;
});
canvas.addEventListener('mouseup', () => { inputLeft = false; inputRight = false; });

// ========== 게임 시작 ==========
function startGame() {
  time = 0;
  balls = []; particles = []; floatingTexts = [];
  player.x = W / 2; player.vx = 0; player.ax = 0;
  player.frame = 0; player.invincible = 0;
  facingBack = false;
  speechBubble.timer = 0;
  lastSpeechTime = 0;
  matchIndex = 0; matchWins = 0; matchDraws = 0; matchLosses = 0;
  shuffleTeams();
  startMatch();
}

// ========== 스폰 ==========
function spawnBall() {
  const sizes = [10, 12, 14];
  const r = sizes[Math.floor(Math.random() * sizes.length)];
  balls.push({
    x: Math.random() * (W - 40) + 20,
    y: -r * 2, r,
    vy: 3 + Math.random() * 2.5 + matchDifficulty * 0.6,
    vx: matchDifficulty > 2 ? (Math.random() - 0.5) * 1.5 : 0,
    rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.15,
    type: 'normal',
  });
}

function spawnGoldenBall() {
  const fast = Math.random() < 0.35; // 35% 확률로 빠른 황금공
  balls.push({
    x: Math.random() * (W - 60) + 30,
    y: -20, r: fast ? 12 : 14,
    vy: fast ? (4 + Math.random() * 2.5) : (2.8 + Math.random() * 1.5),
    vx: (Math.random() - 0.5) * (fast ? 2.5 : 1.2),
    rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.15,
    type: 'golden',
  });
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      life: 25 + Math.random() * 20, maxLife: 45,
      color, size: 2 + Math.random() * 3,
    });
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 60, vy: -2 });
}

function shake(amount) {
  screenShakeX = (Math.random() - 0.5) * amount;
  screenShakeY = (Math.random() - 0.5) * amount;
}

// ========== 그리기 ==========
// 말풍선 트리거 (벽 충돌 시 또는 랜덤)
function triggerSpeech() {
  const text = speeches[Math.floor(Math.random() * speeches.length)];
  speechBubble = { text, timer: 120, x: player.x, y: player.y - 55 };
  lastSpeechTime = time;
}

// 말풍선 그리기
function drawSpeechBubble() {
  if (speechBubble.timer <= 0) return;
  const alpha = Math.min(1, speechBubble.timer / 20);
  const bx = player.x;
  const by = player.y - 58 - Math.sin(time * 0.08) * 3;

  ctx.save();
  ctx.globalAlpha = alpha;

  // 말풍선 텍스트 측정
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  const lines = speechBubble.text.split('\n');
  const lineH = 14;
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const bubbleW = maxW + 18;
  const bubbleH = lines.length * lineH + 10;
  const bLeft = bx - bubbleW / 2;
  const bTop = by - bubbleH;

  // 말풍선 배경
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(bLeft, bTop, bubbleW, bubbleH, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bLeft, bTop, bubbleW, bubbleH, 8);
  ctx.stroke();

  // 꼬리 (삼각형)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(bx - 5, bTop + bubbleH);
  ctx.lineTo(bx, bTop + bubbleH + 7);
  ctx.lineTo(bx + 5, bTop + bubbleH);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(bx - 5, bTop + bubbleH);
  ctx.lineTo(bx, bTop + bubbleH + 7);
  ctx.lineTo(bx + 5, bTop + bubbleH);
  ctx.stroke();
  // 꼬리 연결부 하얀 덮개
  ctx.fillStyle = '#fff';
  ctx.fillRect(bx - 6, bTop + bubbleH - 2, 12, 3);

  // 텍스트
  ctx.fillStyle = '#222';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  lines.forEach((line, i) => {
    ctx.fillText(line, bx, bTop + 14 + i * lineH);
  });

  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(time / 3) % 2 === 0) return;

  const speed = Math.abs(p.vx);
  const t = time; // time 기반 (프레임 독립적)
  // 2초 주기로 애니메이션 전환 (120프레임)
  const animCycle = Math.floor(t / 120) % 6;
  let bounce, armSwing, legSwing;
  let extraAnim = null;

  // 달리면서도 까부는 동작이 섞임
  const runMix = Math.min(speed / 6, 1); // 0~1, 달리기 블렌딩

  if (animCycle === 1) {
    // 점프 응원
    bounce = -Math.abs(Math.sin(t * 0.08)) * 14 * (1 - runMix * 0.5);
    armSwing = Math.sin(t * 0.12) * (40 - runMix * 10);
    legSwing = Math.sin(t * 0.12) * (8 + runMix * 10);
    extraAnim = 'jump';
  } else if (animCycle === 2) {
    // 태클 슬라이딩
    bounce = 6 * (1 - runMix) + Math.sin(t * 0.1) * 2;
    armSwing = -30 + Math.sin(t * 0.15) * 15;
    legSwing = (35 + Math.sin(t * 0.12) * 10) * (1 - runMix * 0.5);
    extraAnim = 'tackle';
  } else if (animCycle === 3) {
    // 수건 크게 흔들기
    bounce = Math.sin(t * 0.1) * 4;
    armSwing = Math.sin(t * 0.08) * 55;
    legSwing = Math.sin(t * 0.1) * (6 + runMix * 8);
    extraAnim = 'towel';
  } else if (animCycle === 4) {
    // 만세 (양팔 하늘로)
    bounce = Math.sin(t * 0.12) * 3 - 2;
    armSwing = -65 + Math.sin(t * 0.06) * 20;
    legSwing = Math.sin(t * 0.15) * (10 + runMix * 8);
    extraAnim = 'banzai';
  } else if (animCycle === 5) {
    // 엉덩이춤
    bounce = Math.sin(t * 0.18) * 3;
    armSwing = Math.sin(t * 0.12) * 20;
    legSwing = Math.sin(t * 0.1) * 5;
    extraAnim = 'wiggle';
  } else {
    // 기본 달리기/까부기
    bounce = Math.sin(t * 0.13) * (4 + speed * 0.6);
    armSwing = Math.sin(t * 0.13) * (20 + speed * 4);
    legSwing = Math.sin(t * 0.13) * (14 + speed * 2.5);
  }

  // 달리기 블렌딩 (빠르면 팔다리 더 크게)
  if (speed > 1 && extraAnim) {
    const runArm = Math.sin(t * 0.15) * speed * 4;
    const runLeg = Math.sin(t * 0.15) * speed * 3;
    armSwing = armSwing * (1 - runMix * 0.4) + runArm * runMix * 0.4;
    legSwing = legSwing * (1 - runMix * 0.3) + runLeg * runMix * 0.3;
  }

  const bodyTilt = extraAnim === 'tackle' ? p.direction * 25 :
                   extraAnim === 'wiggle' ? Math.sin(t * 0.18) * 10 :
                   p.vx * 3.5;
  const px = p.x, py = p.y + bounce;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(bodyTilt * Math.PI / 180);

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 30, 14, 4, 0, 0, Math.PI * 2); ctx.fill();

  function nearBallCheck() {
    return balls.some(b => Math.abs(b.x - px) < 30 && b.y > py - 80 && b.y < py);
  }
  const nearBall = nearBallCheck();

  // === 다리 (검은 바지 + 운동화) ===
  [[-5, 1], [5, -1]].forEach(([tx, dir]) => {
    ctx.save();
    ctx.translate(tx, 14);
    ctx.rotate(legSwing * dir * Math.PI / 180);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-2.5, 0, 5, 17);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-3.5, 15, 7, 4);
    ctx.fillStyle = '#aaa';
    ctx.fillRect(-3.5, 15, 3, 4);
    ctx.restore();
  });

  const jerseyW = 18, jerseyH = 24;

  if (facingBack) {
    // ============================
    //    뒷모습 (백넘버 18, 백가온)
    // ============================

    // 몸통 (빨간색 등판)
    if (p.invincible > 0) {
      ctx.fillStyle = '#f39c12';
    } else {
      ctx.fillStyle = '#d42a2a';
    }
    ctx.beginPath(); ctx.roundRect(-jerseyW/2, -10, jerseyW, jerseyH, 3); ctx.fill();

    if (p.invincible <= 0) {
      // 어깨 줄무늬 (아디다스풍 3선)
      ctx.fillStyle = '#fff';
      ctx.fillRect(-jerseyW/2, -10, jerseyW, 2);

      // 백넘버 "18"
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('18', 0, 6);

      // 이름 "백가온"
      ctx.font = 'bold 5px sans-serif';
      ctx.fillText('백가온', 0, -3);

      // IPARK (하단)
      ctx.font = 'bold 4px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('IPARK', 0, 13);
    }

    // 소매
    const sleeveCol = p.invincible > 0 ? '#e67e22' : '#d42a2a';

    // 왼팔 (뒷모습에서도 까부는 동작)
    ctx.save();
    ctx.translate(-jerseyW/2 - 1, -6);
    ctx.rotate(extraAnim === 'banzai' ? (-140 + Math.sin(t * 0.06) * 20) * Math.PI / 180 : -armSwing * Math.PI / 180);
    ctx.fillStyle = sleeveCol;
    ctx.fillRect(-2.5, 0, 5, 5);
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(-2, 5, 4, 10);
    ctx.beginPath(); ctx.arc(0, 17, 3, 0, Math.PI * 2); ctx.fill();
    // 머플러 (수건모드면 더 크게)
    ctx.fillStyle = '#e74c3c';
    const mufWaveB = extraAnim === 'towel' ? Math.sin(t * 0.08) * 0.9 : Math.sin(t * 0.1) * 0.35;
    const mufLenB = extraAnim === 'towel' ? 18 : 12;
    ctx.save(); ctx.rotate(mufWaveB);
    ctx.fillRect(-mufLenB/2, 13, mufLenB, 2.5);
    ctx.fillRect(-mufLenB/2 - 1, 11, 2, 7);
    ctx.fillRect(mufLenB/2 - 1, 11, 2, 7);
    if (extraAnim === 'towel') {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 3px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('IPARK', 0, 15.5);
    }
    ctx.restore();
    ctx.restore();

    // 오른팔
    ctx.save();
    ctx.translate(jerseyW/2 + 1, -6);
    ctx.rotate(extraAnim === 'banzai' ? (140 + Math.sin(t * 0.06) * 20) * Math.PI / 180 : armSwing * Math.PI / 180);
    ctx.fillStyle = sleeveCol;
    ctx.fillRect(-2.5, 0, 5, 5);
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(-2, 5, 4, 10);
    ctx.beginPath(); ctx.arc(0, 17, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 태클 먼지 (뒷모습)
    if (extraAnim === 'tackle') {
      addParticles(px + p.direction * 8, p.y + 28, 'rgba(150,200,150,0.4)', 1);
    }

    // 머리 (뒷모습)
    const headR = 14;
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath(); ctx.arc(0, -22, headR, 0, Math.PI * 2); ctx.fill();

    // 뒷머리 (더 많이 보이게)
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, -24, 13.5, 0, Math.PI * 2); ctx.fill();
    // 목
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(-3, -10, 6, 4);

    // 귀 (양쪽)
    ctx.fillStyle = '#f0b898';
    ctx.beginPath(); ctx.ellipse(-13, -20, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13, -20, 3, 4, 0, 0, Math.PI * 2); ctx.fill();

    // 안경다리 (뒤에서 보이는)
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-13, -22); ctx.lineTo(-8, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -22); ctx.lineTo(8, -22); ctx.stroke();

  } else {
    // ============================
    //    앞모습
    // ============================

    // 몸통 (부산 아이파크: 빨강+흰 세로 스플릿)
    if (p.invincible > 0) {
      ctx.fillStyle = '#f39c12';
      ctx.beginPath(); ctx.roundRect(-jerseyW/2, -10, jerseyW, jerseyH, 3); ctx.fill();
    } else {
      // 왼쪽 빨강
      ctx.fillStyle = '#d42a2a';
      ctx.beginPath(); ctx.roundRect(-jerseyW/2, -10, jerseyW/2, jerseyH, [3, 0, 0, 3]); ctx.fill();
      // 오른쪽 흰
      ctx.fillStyle = '#f5f5f5';
      ctx.beginPath(); ctx.roundRect(0, -10, jerseyW/2, jerseyH, [0, 3, 3, 0]); ctx.fill();
      // 가운데선
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 14); ctx.stroke();
      // HDC
      ctx.fillStyle = '#333';
      ctx.font = 'bold 6px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HDC', 0, 4);
      // 엠블럼
      ctx.fillStyle = '#d42a2a';
      ctx.fillRect(-2, -8, 4, 4);
      ctx.fillStyle = '#fff';
      ctx.font = '3px sans-serif';
      ctx.fillText('i', 0, -5);
    }

    const sleeveL = p.invincible > 0 ? '#e67e22' : '#d42a2a';
    const sleeveR = p.invincible > 0 ? '#e67e22' : '#f5f5f5';

    // 왼팔
    ctx.save();
    ctx.translate(-jerseyW/2 - 1, -6);
    ctx.rotate(extraAnim === 'banzai' ? (-140 + Math.sin(p.frame * 0.15) * 15) * Math.PI / 180 : -armSwing * Math.PI / 180);
    ctx.fillStyle = sleeveL;
    ctx.fillRect(-2.5, 0, 5, 5);
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(-2, 5, 4, 10);
    ctx.beginPath(); ctx.arc(0, 17, 3, 0, Math.PI * 2); ctx.fill();
    // 수건 흔들기
    if (extraAnim === 'towel' || (!nearBall && extraAnim !== 'tackle')) {
      const mufWave = extraAnim === 'towel' ? Math.sin(p.frame * 0.2) * 0.8 : Math.sin(p.frame * 0.25) * 0.3;
      ctx.save(); ctx.rotate(mufWave);
      ctx.fillStyle = '#e74c3c';
      const mufLen = extraAnim === 'towel' ? 16 : 10;
      ctx.fillRect(-mufLen/2, 13, mufLen, 2.5);
      ctx.fillRect(-mufLen/2 - 1, 11, 2, 7);
      ctx.fillRect(mufLen/2 - 1, 11, 2, 7);
      // 수건에 글씨 (수건 흔들기 모드)
      if (extraAnim === 'towel') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 3px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('IPARK', 0, 15.5);
      }
      ctx.restore();
    }
    ctx.restore();

    // 오른팔
    ctx.save();
    ctx.translate(jerseyW/2 + 1, -6);
    ctx.rotate(extraAnim === 'banzai' ? (140 + Math.sin(p.frame * 0.15) * 15) * Math.PI / 180 : armSwing * Math.PI / 180);
    ctx.fillStyle = sleeveR;
    ctx.fillRect(-2.5, 0, 5, 5);
    ctx.fillStyle = '#f5cba7';
    ctx.fillRect(-2, 5, 4, 10);
    ctx.beginPath(); ctx.arc(0, 17, 3, 0, Math.PI * 2); ctx.fill();
    // 주먹/손
    ctx.fillStyle = extraAnim === 'banzai' ? '#f5cba7' : '#eab892';
    ctx.fillRect(-2, 15, 4, 3);
    ctx.restore();

    // 태클 이펙트 (먼지)
    if (extraAnim === 'tackle') {
      addParticles(px + p.direction * 10, p.y + 28, 'rgba(150,200,150,0.4)', 1);
    }

    // 머리
    const headR = 14;
    ctx.fillStyle = '#f5cba7';
    ctx.beginPath(); ctx.arc(0, -22, headR, 0, Math.PI * 2); ctx.fill();

    // 머리카락
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, -28, 13, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-10, -28);
    ctx.quadraticCurveTo(-8, -20, -3, -22);
    ctx.quadraticCurveTo(0, -19, 3, -22);
    ctx.quadraticCurveTo(6, -20, 9, -27);
    ctx.lineTo(10, -30);
    ctx.arc(0, -28, 13, -0.15 * Math.PI, -0.85 * Math.PI, true);
    ctx.fill();

    // 안경
    const eyeOff = p.direction * 1.5;
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.ellipse(-5 + eyeOff, -22, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(5 + eyeOff, -22, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.5 + eyeOff, -22); ctx.lineTo(0.5 + eyeOff, -22); ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-10.5 + eyeOff, -22); ctx.lineTo(-14, -21); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10.5 + eyeOff, -22); ctx.lineTo(14, -21); ctx.stroke();
    ctx.fillStyle = 'rgba(200,220,255,0.15)';
    ctx.beginPath(); ctx.ellipse(-5 + eyeOff, -22, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5 + eyeOff, -22, 5, 4, 0, 0, Math.PI * 2); ctx.fill();

    // 눈
    const eyeR = nearBall ? 3 : 2;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(-5 + eyeOff, -21.5, eyeR, 0, Math.PI * 2);
    ctx.arc(5 + eyeOff, -21.5, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-4 + eyeOff, -22.5, 0.8, 0, Math.PI * 2);
    ctx.arc(6 + eyeOff, -22.5, 0.8, 0, Math.PI * 2);
    ctx.fill();

    // 놀람 이펙트
    if (nearBall) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-3 + eyeOff, -28); ctx.lineTo(-1 + eyeOff, -30);
      ctx.moveTo(3 + eyeOff, -28); ctx.lineTo(1 + eyeOff, -30);
      ctx.stroke();
    }

    // 코
    ctx.fillStyle = '#e8b090';
    ctx.beginPath(); ctx.arc(eyeOff * 0.5, -17, 1.5, 0, Math.PI * 2); ctx.fill();

    // 입 (애니메이션에 따라 다양한 표정)
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (nearBall) {
      ctx.arc(eyeOff * 0.3, -13, 3.5, 0, Math.PI * 2); // 놀람
    } else if (extraAnim === 'banzai' || extraAnim === 'towel') {
      // 환호 - 크게 웃기
      ctx.arc(eyeOff * 0.3, -13, 5, 0.05 * Math.PI, 0.95 * Math.PI);
      ctx.fillStyle = '#c0392b'; ctx.fill();
      ctx.fillStyle = '#e57373';
      ctx.beginPath(); ctx.arc(eyeOff * 0.3, -11, 2.5, 0, Math.PI); ctx.fill();
    } else if (extraAnim === 'tackle') {
      // 으악 표정
      ctx.arc(eyeOff * 0.3, -13, 3, 0, Math.PI * 2);
    } else if (extraAnim === 'wiggle') {
      // 히죽 웃기
      ctx.moveTo(-4 + eyeOff * 0.3, -14);
      ctx.quadraticCurveTo(eyeOff * 0.3, -10, 4 + eyeOff * 0.3, -14);
    } else if (speed > 4) {
      ctx.arc(eyeOff * 0.3, -13, 4, 0.05 * Math.PI, 0.95 * Math.PI);
      ctx.fillStyle = '#c0392b'; ctx.fill();
    } else if (Math.sin(p.frame * 0.2) > 0) {
      ctx.arc(eyeOff * 0.3, -13, 4, 0.1 * Math.PI, 0.9 * Math.PI);
    } else {
      ctx.moveTo(-3 + eyeOff * 0.3, -13);
      ctx.lineTo(3 + eyeOff * 0.3, -14);
      ctx.lineTo(1 + eyeOff * 0.3, -12);
    }
    ctx.stroke();

    // 홍조
    ctx.fillStyle = 'rgba(255,130,130,0.3)';
    ctx.beginPath();
    ctx.ellipse(-9, -16, 3, 2, 0, 0, Math.PI * 2);
    ctx.ellipse(9, -16, 3, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 땀
    if (nearBall) {
      ctx.fillStyle = 'rgba(100,180,255,0.7)';
      ctx.beginPath(); ctx.ellipse(p.direction > 0 ? -12 : 12, -20, 1.5, 3, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.direction > 0 ? -14 : 14, -16, 1, 2, 0.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.restore();

  // 미끄러짐 먼지
  if (speed > 2) {
    const dustCount = speed > 5 ? 2 : 1;
    for (let i = 0; i < dustCount; i++) {
      addParticles(px + (Math.random() - 0.5) * 10, p.y + 28, 'rgba(180,220,180,0.5)', 1);
    }
  }
}

function drawBallSprite(b) {
  if (b.type === 'golden') {
    // 황금 축구공
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rotation);
    // 글로우
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r * 2);
    glow.addColorStop(0, `rgba(255,215,0,${0.3 + Math.sin(time * 0.1) * 0.15})`);
    glow.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 2, 0, Math.PI * 2); ctx.fill();
    // 공 본체
    const bg = ctx.createRadialGradient(-b.r * 0.2, -b.r * 0.3, 0, 0, 0, b.r);
    bg.addColorStop(0, '#fff7aa');
    bg.addColorStop(0.4, '#ffd700');
    bg.addColorStop(1, '#b8860b');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
    // 별 마크
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${b.r}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', 0, 0);
    // 테두리
    ctx.strokeStyle = 'rgba(180,130,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  } else {
    const img = ballImages[b.r];
    if (!img) return;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rotation);
    ctx.drawImage(img, -b.r, -b.r, b.r * 2, b.r * 2);
    ctx.restore();
  }

  // 바닥 그림자
  if (b.y < H - 50) {
    const dist = (H - 50 - b.y) / H;
    const alpha = Math.max(0, 0.2 - dist * 0.3);
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(b.x, H - 42, b.r * 0.6, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}


// 전광판 그리기
function drawScoreboard() {
  const sbY = 4;
  const sbH = 50;

  // 전광판 배경
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.beginPath(); ctx.roundRect(10, sbY, W - 20, sbH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(10, sbY, W - 20, sbH, 6); ctx.stroke();

  // 타이머 (축구 분 표시)
  const elapsed = MATCH_TIME - matchTimer;
  const minuteIdx = Math.min(Math.floor(elapsed / 60), MATCH_MINUTES.length - 1);
  const minuteStr = MATCH_MINUTES[minuteIdx] || '추가시간';
  const isLate = minuteIdx >= 8; // 후반 40분 이후
  const timerColor = isLate ? '#ff3333' : minuteIdx >= 5 ? '#ff9900' : '#fff';
  ctx.fillStyle = timerColor;
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(minuteStr, W / 2, sbY + 20);

  // 부산
  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('부산', 20, sbY + 16);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(`${busanGoals}`, 56, sbY + 18);

  // 상대팀
  ctx.fillStyle = '#88bbff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'right';
  const oppShort = matchOpponent.length > 5 ? matchOpponent.substring(0, 5) : matchOpponent;
  ctx.fillText(oppShort, W - 20, sbY + 16);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${opponentGoals}`, W - 56, sbY + 18);

  // 하단: 라운드 + 전적
  ctx.fillStyle = '#aaa';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${matchIndex + 1}/${TOTAL_MATCHES}R`, 20, sbY + 42);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#888';
  ctx.fillText(`${matchWins}승 ${matchDraws}무 ${matchLosses}패`, W / 2, sbY + 42);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText(`승점 ${matchWins * 3 + matchDraws}`, W - 20, sbY + 42);

  // 전광판 메시지
  if (boardTimer > 0) {
    const msgAlpha = Math.min(1, boardTimer / 20);
    ctx.globalAlpha = msgAlpha;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.beginPath(); ctx.roundRect(30, sbY + sbH + 4, W - 60, 24, 6); ctx.fill();
    const flash = Math.sin(time * 0.15) > 0;
    ctx.fillStyle = flash ? '#f1c40f' : '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(boardMessage, W / 2, sbY + sbH + 20);
    ctx.globalAlpha = 1;
  }

  // 후반 40분 이후 경고 (마지막 3초)
  if (matchTimer <= 180 && matchTimer > 0 && Math.sin(time * 0.12) > 0.3) {
    ctx.fillStyle = `rgba(255,30,30,${0.08 + (1 - matchTimer / 180) * 0.1})`;
    ctx.fillRect(0, 0, W, H);
  }
}

}

// ========== 경기 결과 (승리/무승부 후 다음경기) ==========

  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(isWin ? '승리!' : '무승부', W / 2, H / 2 - 80);

  // 스코어
  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('부산', W / 2 - 28, H / 2 - 50);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${busanGoals}`, W / 2 - 16, H / 2 - 30);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('-', W / 2, H / 2 - 32);
  ctx.font = 'bold 32px sans-serif';
  ctx.fillText(`${opponentGoals}`, W / 2 + 16, H / 2 - 30);

  }

  // 승점
  const points = matchWins * 3 + matchDraws;
  ctx.fillStyle = isWin ? '#2ecc71' : '#f1c40f';

  // 전적
  ctx.fillStyle = '#aaa';
  ctx.font = '12px sans-serif';
  ctx.fillText(`${matchWins}승 ${matchDraws}무 ${matchLosses}패  |  남은 ${TOTAL_MATCHES - matchIndex - 1}경기`, W / 2, H / 2 + 50);

  // 다음경기 버튼
  const btnY = H / 2 + 75;
  nextBtn.y = btnY;

// ========== 충돌 ==========
function checkCollision(b) {
  const px = player.x, py = player.y - 8, pw = 14, ph = 34;
  const cx = Math.max(px - pw, Math.min(b.x, px + pw));
  const cy = Math.max(py - ph, Math.min(b.y, py + ph));
  const dx = b.x - cx, dy = b.y - cy;
  return (dx * dx + dy * dy) < (b.r * 0.85) * (b.r * 0.85);
}



// ========== 업데이트 ==========
function update() {
  time++;
  screenShakeX *= 0.85;
  screenShakeY *= 0.85;

  if (state !== 'playing') return;

  // 전광판 타이머
  if (boardTimer > 0) boardTimer--;

  // 경기 타이머
  matchTimer--;

  // 경기 진행 상황
  const elapsed = MATCH_TIME - matchTimer;
  const minuteIdx = Math.min(Math.floor(elapsed / 60), MATCH_MINUTES.length - 1);
  const isSecondHalf = minuteIdx >= 5;
  const isClutchTime = minuteIdx >= 8; // 후반 40분 이후 + 추가시간
  const isExtraTime = minuteIdx >= 10;  // 추가시간

  // ===== 경기종료 =====
  if (matchTimer <= 0) {
    let result;
    if (busanGoals > opponentGoals) {
      matchWins++; result = 'win';
    } else if (busanGoals === opponentGoals) {
      matchDraws++; result = 'draw';
    } else {
      matchLosses++; result = 'lose';
    }

    // 10경기 다 했는지
    if (matchIndex >= TOTAL_MATCHES - 1) {
      state = 'ending';
    } else if (result === 'lose') {
      state = 'over'; // 패배 → 게임오버
    } else {
      state = 'matchResult'; // 승/무 → 다음경기
    }
    return;
  }

  // ===== 이동 =====
  if (inputLeft) player.ax = -player.accel;
  else if (inputRight) player.ax = player.accel;
  else player.ax = 0;

  player.vx += player.ax;
  player.vx *= player.friction;
  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  if (Math.abs(player.vx) < 0.05) player.vx = 0;
  player.x += player.vx;

  if (player.x < 18) {
    player.x = 18; player.vx *= -0.5; shake(5);
    facingBack = !facingBack;
    if (time - lastSpeechTime > 60) triggerSpeech();
  }
  if (player.x > W - 18) {
    player.x = W - 18; player.vx *= -0.5; shake(5);
    facingBack = !facingBack;
    if (time - lastSpeechTime > 60) triggerSpeech();
  }
  if (player.vx > 0.5) player.direction = 1;
  else if (player.vx < -0.5) player.direction = -1;

  player.frameTimer++;
  if (player.frameTimer > 3) { player.frame++; player.frameTimer = 0; }
  if (player.invincible > 0) player.invincible--;

  // ===== 스폰 =====
  const winning = busanGoals > opponentGoals;
  const losing = busanGoals < opponentGoals;

  // 일반 축구공 (맞으면 실점)
  let ballRate = Math.max(10, 28 - matchDifficulty * 3);
  if (isClutchTime && winning) ballRate = Math.max(6, ballRate - 10);
  else if (isSecondHalf) ballRate = Math.max(8, ballRate - 5);
  if (time % Math.floor(ballRate) === 0) spawnBall();

  // 황금공 (먹으면 득점)
  let goldenRate = Math.max(70, 130 - matchDifficulty * 10);
  if (isClutchTime && losing) goldenRate = Math.max(35, goldenRate - 45);
  else if (isExtraTime) goldenRate = Math.max(45, goldenRate - 25);
  if (time % Math.floor(goldenRate) === 0) spawnGoldenBall();

  // ===== 공 업데이트 =====
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.y += b.vy;
    b.x += (b.vx || 0);
    b.rotation += b.rotSpeed;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx || 0); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx || 0); }
    if (b.y > H + b.r * 2) { balls.splice(i, 1); continue; }

    if (player.invincible <= 0 && checkCollision(b)) {
      if (b.type === 'golden') {
        // 황금공 = 득점!
        busanGoals++;
        const scorer = busanPlayers[Math.floor(Math.random() * busanPlayers.length)];
        goalScorers.push(scorer);
        boardMessage = `⚽ GOAL! ${scorer}!!`;
        boardTimer = 100;
        shake(8);
        addParticles(b.x, b.y, '#ffd700', 20);
        addFloatingText(player.x, player.y - 50, `⚽ ${scorer} 골!`, '#f1c40f');
        balls.splice(i, 1);
        player.invincible = 20;
      } else {
        // 일반공 = 실점 1점!
        opponentGoals++;
        boardMessage = `${matchOpponent} 득점!`;
        boardTimer = 80;
        shake(8);
        addParticles(player.x, player.y, '#e74c3c', 15);
        addFloatingText(player.x, player.y - 50, '실점!', '#ff4444');
        balls.splice(i, 1);
        player.invincible = 50; // 0.8초 무적 (연속 실점 방지)
        // 무적 중 주변 공 제거
        for (let j = balls.length - 1; j >= 0; j--) {
          if (balls[j].type !== 'golden') {
            const dx = balls[j].x - player.x, dy = balls[j].y - player.y;
            if (Math.sqrt(dx*dx + dy*dy) < 40) { balls.splice(j, 1); if (j < i) i--; }
          }
        }
      }
      continue;
    }
  }

  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy; ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // 말풍선
  if (speechBubble.timer > 0) speechBubble.timer--;
  if (time - lastSpeechTime > 180 + Math.random() * 180 && speechBubble.timer <= 0) {
    triggerSpeech();
  }
}

// ========== 경기종료 화면 ==========
// ========== 승격 엔딩 ==========
function drawEnding() {
  // 배경 (화려하게)
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);

  // 빛나는 파티클
  for (let i = 0; i < 20; i++) {
    const ex = (i * 73.7 + time * 0.5) % W;
    const ey = (i * 53.3 + time * 0.3) % H;
    const es = 1.5 + Math.sin(time * 0.03 + i) * 1;
    ctx.fillStyle = `rgba(255,${200 + i * 3},0,${0.3 + Math.sin(time * 0.05 + i) * 0.2})`;
    ctx.beginPath(); ctx.arc(ex, ey, es, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(W / 2 - 160, H / 2 - 160, 320, 340, 20); ctx.fill();

  // 결과 판정: 10승=우승, 8승+=승격, 6승+=플옵, 나머지=잔류
  let resultEmoji, resultTitle, resultSub, resultColor, resultMsg;
  if (matchWins === 10) {
    resultEmoji = '🏆'; resultTitle = 'K리그2 우승!';
    resultSub = 'K리그1 자동 승격!'; resultColor = '#f1c40f';
    resultMsg = '전승 우승! 박주석 레전드!';
  } else if (matchWins >= 8) {
    resultEmoji = '🎉'; resultTitle = 'K리그1 승격!';
    resultSub = '2위 자동 승격!'; resultColor = '#2ecc71';
    resultMsg = '부산이 1부리그로 올라갑니다!';
  } else if (matchWins >= 6) {
    resultEmoji = '⚔️'; resultTitle = '승격 플레이오프 진출!';
    resultSub = '플옵에서 승격을 노린다!'; resultColor = '#ff9900';
    resultMsg = '아직 끝나지 않았다!';
  } else {
    resultEmoji = '😢'; resultTitle = 'K리그2 잔류';
    resultSub = '내년을 기약하며...'; resultColor = '#888';
    resultMsg = '다음 시즌에 다시 도전!';
  }

  const tBounce = Math.sin(time * 0.04) * 5;
  ctx.font = `${50 + Math.sin(time * 0.05) * 3}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(resultEmoji, W / 2, H / 2 - 100 + tBounce);

  const flash = Math.sin(time * 0.08);
  ctx.fillStyle = flash > 0 ? resultColor : '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(resultTitle, W / 2, H / 2 - 52);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(resultSub, W / 2, H / 2 - 28);

  ctx.fillStyle = '#ccc';
  ctx.font = '13px sans-serif';
  ctx.fillText(`${matchWins}승 ${matchDraws}무 ${matchLosses}패  |  승점 ${matchWins * 3 + matchDraws}`, W / 2, H / 2 + 5);

  ctx.fillStyle = '#ffaa55';
  ctx.font = '12px sans-serif';
  ctx.fillText('진짜같은 가짜팬 박주석의 응원 결과:', W / 2, H / 2 + 35);
  ctx.fillStyle = resultColor;
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(resultMsg, W / 2, H / 2 + 55);

  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('사나이 자존심 부산에 걸었다!', W / 2, H / 2 + 85);

  // 다시시작 버튼
  const btnY = H / 2 + 120;
  restartBtn.y = btnY;
  const pulse = Math.sin(time * 0.06) * 0.1 + 1;
  ctx.save();
  ctx.translate(W / 2, btnY + 22);
  ctx.scale(pulse, pulse);
  ctx.translate(-W / 2, -(btnY + 22));
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath(); ctx.roundRect(restartBtn.x, btnY, restartBtn.w, restartBtn.h, 22); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('다시 도전!', W / 2, btnY + 28);
  ctx.restore();
}

// ========== 렌더 ==========
function render() {
  ctx.save();
  ctx.translate(screenShakeX, screenShakeY);

  ctx.drawImage(fieldBg, 0, 0);


  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;



  for (const b of balls) drawBallSprite(b);
  drawPlayer();
  if (state === 'playing') drawSpeechBubble();

  if (state === 'playing') drawUI();
  else if (state === 'ready') drawStartScreen();
  else if (state === 'over') drawGameOver();
  else if (state === 'matchResult') drawMatchResult();
  else if (state === 'ending') drawEnding();

  ctx.restore();
}

// 60fps 고정 (120Hz 폰에서도 동일한 속도)
let lastFrameTime = 0;
const FRAME_INTERVAL = 1000 / 60; // 16.67ms
let accumulator = 0;

function gameLoop(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const elapsed = timestamp - lastFrameTime;
  lastFrameTime = timestamp;
  accumulator += elapsed;

  // 60fps 간격으로만 업데이트 (밀린 프레임은 최대 3번까지)
  let steps = 0;
  while (accumulator >= FRAME_INTERVAL && steps < 3) {
    update();
    accumulator -= FRAME_INTERVAL;
    steps++;
  }

  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
